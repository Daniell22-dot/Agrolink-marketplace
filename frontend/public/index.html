<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0E3D2B" />
  <meta name="description" content="AgroLink - Kenya's agricultural marketplace. Buy and sell fresh farm produce, livestock, dairy, seeds, fertilizers, and farm tools directly from verified farmers." />
  <meta name="keywords" content="agriculture, kenya, marketplace, farmers, farm produce, maize, tomatoes, livestock, dairy, seeds, fertilizer, farm tools, buy farm produce, sell farm produce, AgroLink" />
  <meta name="author" content="AgroLink" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://agrolink.co.ke/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://agrolink.co.ke/" />
  <meta property="og:title" content="AgroLink - Kenya's Agricultural Marketplace" />
  <meta property="og:description" content="Buy and sell fresh farm produce, livestock, dairy, seeds, fertilizers, and farm tools directly from verified farmers across Kenya." />
  <meta property="og:image" content="https://agrolink.co.ke/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="en_KE" />
  <meta property="og:site_name" content="AgroLink" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://agrolink.co.ke/" />
  <meta property="twitter:title" content="AgroLink - Kenya's Agricultural Marketplace" />
  <meta property="twitter:description" content="Buy and sell fresh farm produce, livestock, dairy, seeds, fertilizers, and farm tools directly from verified farmers across Kenya." />
  <meta property="twitter:image" content="https://agrolink.co.ke/og-image.jpg" />

  <!-- Structured Data / JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "AgroLink Kenya",
    "url": "https://agrolink.co.ke",
    "logo": "https://agrolink.co.ke/logo.png",
    "description": "Connecting agricultural producers directly with buyers in Kenya",
    "contactPoint": {
      "@type": "ContactPoint",
      "telephone": "+254-700-000-000",
      "contactType": "customer service",
      "areaServed": "KE",
      "availableLanguage": ["en", "sw"]
    },
    "sameAs": [
      "https://twitter.com/agrolinkke",
      "https://facebook.com/agrolinkke",
      "https://instagram.com/agrolinkke"
    ]
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "AgroLink Kenya",
    "url": "https://agrolink.co.ke",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://agrolink.co.ke/products?search={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <title>AgroLink - Kenya's Agricultural Marketplace | Fresh Farm Produce & Livestock</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>

</html>
